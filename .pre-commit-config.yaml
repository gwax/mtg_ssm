repos:
  - repo: local
    hooks:
      - id: black
        name: black
        description: "Black: The uncompromising Python code formatter"
        entry: uv run --frozen black
        language: system
        require_serial: true
        types: [python]
      - id: mypy
        name: Type checking from mypy
        language: system
        entry: uv run --frozen mypy
        types: [python]
      - id: ruff
        name: ruff
        description: "Run ruff on files"
        entry: uv run --frozen ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        args: [--fix, --exit-non-zero-on-fix]
        require_serial: true
      - id: doc8-python
        name: Documentation checking from doc8 (Python)
        language: system
        entry: uv run --frozen doc8
        types: [python]
      - id: doc8-rst
        name: Documentation checking from doc8 (reStructuredText)
        language: system
        entry: uv run --frozen doc8
        types: [rst]
      - id: eclint
        name: EditorConfig file validation
        language: node
        additional_dependencies: [eclint]
        entry: eclint
        args: [check]
